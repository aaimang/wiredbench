# Install with: uv run pre-commit install
# These are for fast feedback. Hooks can be skipped, so CI is the real gate.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: pytest
        name: script tests
        entry: uv run pytest -x
        language: system
        pass_filenames: false
        files: ^(scripts/|tests/scripts/|turbo-plugin/manifest\.json|turbo-plugin/CHANGELOG\.md|pyproject\.toml|uv\.lock)

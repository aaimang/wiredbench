name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs that need the submodules (Turbo and nitro-next) are off until they can be fetched. They
# are private copies under aaimang/: add a secret SUBMODULES_TOKEN that can read
# aaimang/turbo-cloud, turbo-admin and nitro-next, then set the repository variable SUBMODULES to
# true.

jobs:
  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run ruff format --check scripts tests/scripts
      - run: uv run ruff check scripts tests/scripts
      - run: uv run pytest

  plugin-version:
    # A change to turbo-plugin/ raises manifest.json's Version and adds its CHANGELOG.md heading
    # (python scripts/plugin_version.py --bump patch).
    name: Plugin version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --no-project python scripts/plugin_version.py --check --base "origin/${{ github.base_ref || 'main' }}"
        if: ${{ github.event_name == 'pull_request' }}
      - run: uv run --no-project python scripts/plugin_version.py --check --base "${{ github.event.before }}"
        if: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}

  plugin:
    # The plugin's tests (tests/plugin) against the pinned Turbo, built as deploy/setup.sh builds it.
    name: Plugin tests
    if: ${{ vars.SUBMODULES == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: vendor/turbo-cloud/global.json
      - run: dotnet build vendor/turbo-cloud/Turbo.Main/Turbo.Main.csproj
      - run: dotnet test tests/plugin/Wiredbench.Tests

  parity:
    # Every wired code the Habbo client knows against the pinned Turbo's boxes and nitro-next's
    # editors (scripts/parity.py --check; the client's codes are the committed
    # docs/parity/client-codes.json).
    name: WIRED box parity
    if: ${{ vars.SUBMODULES == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run python scripts/parity.py --check

  windows:
    # The Windows deploy scripts on a Windows machine: setup.ps1 fetches the submodules, builds
    # Turbo and installs the panel's and the client's packages; check-client.ps1 type-checks the
    # plugin's client module; then the plugin's tests run against that Turbo build.
    name: Windows
    if: ${{ vars.SUBMODULES == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: vendor/turbo-cloud/global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pwsh -NoProfile -File deploy/setup.ps1
      - run: pwsh -NoProfile -File deploy/check-client.ps1
      - run: dotnet test tests/plugin/Wiredbench.Tests

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin:
    # A version of the plugin (turbo-plugin/manifest.json) that reaches main and has no release yet
    # gets one: tag v<version>, continuing the old app's numbering (its last was v0.11.0), its notes
    # from turbo-plugin/CHANGELOG.md, and the plugin's folder as a zip to drop into a hotel's plugins.
    name: Plugin release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: echo "version=$(jq -r .Version turbo-plugin/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Release it unless it is out already
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is out already."
            exit 0
          fi
          awk -v heading="## $VERSION " 'index($0, heading) == 1 { found = 1; next } /^## / { found = 0 } found' \
            turbo-plugin/CHANGELOG.md > notes.md
          (cd turbo-plugin && zip -qr "../wiredbench-plugin-$VERSION.zip" . -x 'bin/*' 'obj/*' '*/bin/*' '*/obj/*')
          gh release create "v$VERSION" "wiredbench-plugin-$VERSION.zip" \
            --title "v$VERSION" --notes-file notes.md --target "$GITHUB_SHA"

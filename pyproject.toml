[project]
name = "wiredbench-scripts"
version = "0.0.0"
description = "Wiredbench's maintenance scripts: WIRED box parity, the plugin version, icons and the behaviour report."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/scripts"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["scripts", "tests/scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM", "C4", "RET"]
ignore = ["E501"]  # ruff format handles line length.

[tool.ruff.lint.per-file-ignores]
"tests/scripts/*" = ["S101", "S105", "S106"]
"scripts/*" = ["S603", "S607"]

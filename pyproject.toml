[project]
name = "wiredbench"
version = "0.6.0"
description = "Self-hosted browser sandbox for building, running and debugging Habbo WIRED."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "defusedxml>=0.7.1",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pillow>=13.0.0",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32",
]

[project.scripts]
wiredbench = "wiredbench.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/wiredbench"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["wiredbench"]
omit = ["*/migrations/*", "*/cli.py", "*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 110
src = ["backend/src", "backend/tests"]
extend-exclude = ["spikes", "backend/src/wiredbench/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM", "C4", "RET"]
ignore = ["B008", "E501"]  # FastAPI's Depends() defaults; ruff format handles line length.

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101", "S105", "S106"]
"scripts/*" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
files = ["backend/src/wiredbench"]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]
